# Integracion local del modulo 4: FFmpeg real, fuentes reales, render real.
#
# Este trabajo EXIGE las pruebas marcadas `ffmpeg`. No puede aparecer verde
# porque se hayan saltado: su informe JUnit XML pasa por
# `tools/verificar_integracion.py`, que rechaza una seleccion vacia, saltada o
# marcada `xfail`. Las tres formas de no ejecutar estan cubiertas por pruebas
# en tests/test_verificar_integracion.py.
#
# No usa red ni credenciales: monta archivos que ya existen en el repositorio.
name: viralgen (integracion FFmpeg)

on:
  push:
    branches: ["**"]
    paths:
      - "viralgen/**"
      - ".github/workflows/viralgen-ffmpeg.yml"
  pull_request:
    paths:
      - "viralgen/**"
      - ".github/workflows/viralgen-ffmpeg.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: viralgen

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Instalar FFmpeg y la fuente tipografica
        run: |
          sudo apt-get update
          # `ffmpeg` trae libx264, AAC y libass; `fonts-dejavu-core` trae
          # DejaVu Sans Bold, que es la fuente por defecto del modulo 4.
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Registrar las versiones REALMENTE usadas
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          # Las capacidades salen de los ejecutables instalados, no de la
          # documentacion en linea.
          ffmpeg -hide_banner -encoders | grep -E ' (libx264|aac) '
          ffmpeg -hide_banner -filters | grep -E ' (ass|loudnorm) '
          ls -l /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e ".[dev]"

      - name: Comprobar que el entorno cumple lo que el montaje exige
        run: |
          python - <<'PY'
          import sys
          from viralgen.render.ffmpeg import probe_capabilities
          from viralgen.render.fonts import load_font

          capacidades = probe_capabilities("ffmpeg", "ffprobe")
          if not capacidades.usable:
              sys.exit(f"faltan capacidades: {capacidades.missing}")
          print("ffmpeg:", capacidades.ffmpeg_version)
          print("libass:", capacidades.has_libass)
          fuente = load_font(None)
          print("fuente:", fuente.family, fuente.sha256[:16])
          PY

      - name: Integracion FFmpeg, obligatoria y EJECUTADA
        run: |
          # Se ejecuta UNA sola vez y se comprueba sobre su informe
          # estructurado. El `|| true` deja que el guard explique el motivo en
          # vez de cortar aqui con un codigo pelado; el guard vuelve a exigir
          # cero fallos, asi que no relaja nada.
          python -m pytest -m ffmpeg -o addopts="" -q -rs --durations=10 \
            --junitxml=integracion.xml || true

      - name: La integracion no puede quedar vacia, saltada ni en xfail
        run: |
          # Sobre JUnit XML, no sobre el texto del resumen: el codigo 5 solo
          # cubre la coleccion vacia, y una seleccion entera en `xfail` sale
          # con codigo 0 SIN imprimir "SKIPPED". Ver tools/ y sus pruebas.
          # El minimo es un SUELO contra un derrumbe silencioso de la marca,
          # no el recuento exacto: puede crecer o menguar con el tiempo.
          python tools/verificar_integracion.py integracion.xml --minimo 40

      - name: Subir el informe de integracion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-integracion-ffmpeg
          path: viralgen/integracion.xml
          if-no-files-found: error

      - name: Resto de la suite (sin red y sin credenciales)
        # Complementario de la marca: entre los dos pasos se ejecuta todo
        # exactamente una vez.
        run: python -m pytest -m "not ffmpeg" -o addopts="" -q -rs

      - name: Recorrido reproducible sobre el ejemplo incluido
        env:
          VIRALGEN_DATA_DIR: ${{ runner.temp }}/viralgen-ci
        run: |
          set -euo pipefail
          E=examples/visuales_simulados
          # 1) Preflight local, sin codificar.
          viralgen render plan --script $E/script.json --voice $E/voz/voice.json \
            --media $E/medios/media.json --preview
          # 2) Render preview real.
          viralgen render generate --script $E/script.json --voice $E/voz/voice.json \
            --media $E/medios/media.json --render-key ci-preview --preview > salida.json
          python -c "import json;d=json.load(open('salida.json'));print(d['render_status'], d['measured'])"
          M=$(python -c "import json;print(json.load(open('salida.json'))['manifest_path'])")
          # 3) Admisible para preview.
          viralgen render validate --script $E/script.json --voice $E/voz/voice.json \
            --media $E/medios/media.json --manifest "$M" --allow-simulation
          # 4) RECHAZADO para publicacion: una simulacion nunca llega al modulo 5.
          if viralgen render validate --script $E/script.json --voice $E/voz/voice.json \
               --media $E/medios/media.json --manifest "$M"; then
            echo "ERROR: una salida preview simulada no puede ser publicable"
            exit 1
          fi
          # 5) Repeticion: cero codificaciones nuevas.
          viralgen render generate --script $E/script.json --voice $E/voz/voice.json \
            --media $E/medios/media.json --render-key ci-preview --preview > repetido.json
          python - <<'PY'
          import json, sys
          d = json.load(open("repetido.json"))
          assert d["reused"] is True, d
          assert d["renders_new"] == 0, d
          print("reutilizacion correcta: renders_new =", d["renders_new"])
          PY

      - name: Validar el paquete de ejemplo que va en el repositorio
        run: |
          E=examples/visuales_simulados
          viralgen render validate --script $E/script.json --voice $E/voz/voice.json \
            --media $E/medios/media.json \
            --manifest examples/montaje_preview/render.json --allow-simulation

      - name: Demostracion del modulo 5, entera en simulacion
        # Sin red, sin credenciales y sin publicar nada: el publicador simulado
        # no tiene cliente HTTP. El propio script falla si el modo real llegara
        # a autorizarse.
        run: |
          set -euo pipefail
          PYTHON=python tools/demo_publicacion.sh "${{ runner.temp }}/viralgen-publish"
          python - <<'PY'
          import json, os, pathlib, sys

          datos = pathlib.Path(os.environ["RUNNER_TEMP"]) / "viralgen-publish"
          recibo = json.loads((datos / "publication.json").read_text(encoding="utf-8"))

          assert recibo["simulation"] is True, recibo["simulation"]
          assert recibo["summary"]["overall"] == "delivered", recibo["summary"]
          estados = {d["destination_id"]: d for d in recibo["destinations"]}
          assert estados["yt"]["state"] == "delivered"
          assert estados["ig"]["state"] == "delivered"
          assert estados["tk"]["state"] == "manually_reported"
          # Se pidio privado en YouTube: entregado, pero NO publicamente visible.
          assert estados["yt"]["publicly_visible"] is False
          assert estados["ig"]["publicly_visible"] is True
          # Nada de esto existe en ninguna plataforma.
          for destino in recibo["destinations"]:
              assert destino["real_remote_id"] is None, destino["destination_id"]

          # El recibo exportable no lleva material sensible.
          texto = (datos / "publication.json").read_text(encoding="utf-8")
          for marca in ("X-Amz-Signature", "access_token", "Authorization", "Bearer "):
              assert marca not in texto, marca

          # El paquete de TikTok sale rotulado como no publicable.
          paquete = json.loads(
              (datos / "08_export_manual.json").read_text(encoding="utf-8")
          )
          assert paquete["published"] is False
          assert pathlib.Path(paquete["package"]["package_path"], "NO_PUBLICABLE.txt").is_file()

          print("demostracion simulada correcta:", recibo["summary"]["overall"])
          PY

      - name: Contratos del modulo 5 exportables y estables
        run: |
          set -euo pipefail
          viralgen publish schema --out "${{ runner.temp }}/schema-publish"
          # Los esquemas del repositorio deben coincidir con los que genera el
          # codigo: un contrato documentado que no es el vigente no sirve.
          diff -u schema/publication_plan.schema.json \
            "${{ runner.temp }}/schema-publish/publication_plan.schema.json"
          diff -u schema/publication_receipt.schema.json \
            "${{ runner.temp }}/schema-publish/publication_receipt.schema.json"
