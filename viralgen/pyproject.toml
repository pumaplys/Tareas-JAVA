[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viralgen"
version = "0.1.0"
description = "Modulo 1: generador de ideas, guiones y prompts de medios (plan JSON validado)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "openai>=3.16,<4",
    # Cliente HTTP del adaptador de voz (modulo 2). Es el que ya resuelve
    # `openai` en este lockfile; se declara directo porque lo usamos nosotros.
    "httpx2>=2.13,<3",
    # Decodificacion, verificacion y geometria de imagenes (modulo 3). El
    # modulo NO confia en la extension ni en el proveedor: abre cada archivo.
    "Pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]
# Solo hace falta para el almacenamiento temporal de Instagram (modulo 5). Sin
# ese destino, el publicador funciona sin esta dependencia.
publish-staging = [
    "boto3>=1.35,<2",
]

[project.scripts]
viralgen = "viralgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viralgen = ["data/*.json", "prompts/v1/*.md", "voice/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:viralgen.*"]
markers = [
    # Pruebas que EJECUTAN FFmpeg/ffprobe de verdad y producen archivos reales.
    # La ejecucion de aceptacion las EXIGE: una suite verde porque todas se
    # saltaron no acredita nada. Se seleccionan con `-m ffmpeg`.
    "ffmpeg: necesita FFmpeg y ffprobe instalados (integracion local real)",
]
